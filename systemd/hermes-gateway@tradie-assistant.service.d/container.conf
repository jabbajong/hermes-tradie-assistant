[Service]
User=root
Group=root
Environment=DOCKER_CONFIG=/tmp/tradie-assistant-docker-config
ExecStart=
ExecStart=/usr/bin/docker run --rm --name hermes-tradie-assistant --network host --env-file /etc/hermes/tradie-assistant.env --env HOME=/opt/hermes-agents/tradie-assistant/home --env HERMES_HOME=/opt/hermes-agents/tradie-assistant --env USER=root --env LOGNAME=root --env PYTHONDONTWRITEBYTECODE=1 --env PYTHONPATH=/opt/hermes-agents/tradie-assistant/workspace/src --volume /opt/hermes-agents/tradie-assistant:/opt/hermes-agents/tradie-assistant:rw --volume /usr/local/lib/hermes-agent:/usr/local/lib/hermes-agent:ro --workdir /opt/hermes-agents/tradie-assistant nadirstack/hermes-tradie-assistant:0.1.0
ExecStop=-/usr/bin/docker stop --timeout 90 hermes-tradie-assistant
SuccessExitStatus=1
ExecStartPost=
ExecStartPost=-/usr/local/sbin/hermes-telegram-menu tradie-assistant
NoNewPrivileges=false
