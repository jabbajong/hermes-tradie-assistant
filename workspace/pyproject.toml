[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-tradie-assistant"
version = "0.1.0"
description = "Tenant-isolated lead-to-quote workflows for a private Hermes Telegram bot"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
